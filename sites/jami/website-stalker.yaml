sites:
- url: https://www.jami.jp/
  headers:
  - 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/120.0.0.0 Safari/537.36'
  editors:
  - css_select: body
  - css_remove: script, style, noscript, iframe
  - regex_replace:
      pattern: (\.(?:pdf|docx?|xlsx?|pptx?|zip|png|jpe?g|gif|webp|svg|ico|css|js))\?(?:(?:ver|v|t|ts|time|timestamp|rev|cb)=)?[0-9][0-9.]*
      replace: $1
  - html_sanitize
  - html_prettify
